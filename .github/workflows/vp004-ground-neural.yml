name: VP-004 Ground-to-native neural inference

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vp/ground_neural.py'
      - 'vp/native_inference.py'
      - 'tests/test_ground_neural.py'
      - 'docs/VP-004.md'
      - '.github/workflows/vp004-ground-neural.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ground-neural:
    name: Existing E-CPU Grounds + Hypervisor + verified sparse tensor (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 6fd416facdb2aefd6fc7d66a06b014e3d31b5a52
          path: external/ecpu
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned E-CPU and supported tensor arithmetic dependencies
        run: |
          python -m pip install -e external/ecpu
          python -m pip install numpy torch safetensors
      - name: Run existing native Ground and computational execution regressions
        run: |
          python -m pytest -q \
            external/ecpu/tests/test_observed_orbit_pipeline.py \
            external/ecpu/tests/test_observer_orbit.py \
            external/ecpu/tests/test_computational_execution.py \
            external/ecpu/tests/test_neural_graph_bridge.py
      - name: Check the new Ground-to-neural native executor and refusal cases
        run: |
          python -c 'import mailcpu; print("actual E-CPU interpreter imported")'
          python -m unittest discover -s tests -p 'test_ground_neural.py' -v
      - name: Run a native, receiver-authorized 128-expert numerical query
        run: |
          python examples/provision_sparse_demo.py --output vp004-demo
          python -m vp.ground_neural \
            --index vp004-demo/weights.json \
            --hidden vp004-demo/hidden.json \
            --token-coordinate 1000000000013 \
            --request-id vp004-ci > vp004-observation.json
          python - <<'PY'
          import json
          receipt = json.load(open('vp004-observation.json'))
          assert receipt['status'] == 'realized'
          assert receipt['ground']['observed_position'] == 1000000000013
          assert receipt['ground']['expanded_states'] == 0
          assert receipt['native']['accepted'] is True
          assert receipt['native']['result']['receipt']['actual_neural_math_executed'] is True
          assert len(receipt['native']['result']['receipt']['selected_experts']) == 8
          assert receipt['full_model_forward_executed'] is False
          print('Ground-observed native neural operation verified')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vp004-ground-neural-receipt-${{ matrix.python }}
          path: vp004-observation.json
          if-no-files-found: error
